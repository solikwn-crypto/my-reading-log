<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 독서 기록장</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #fbf8f2;
      background-image: radial-gradient(#e8dfd1 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .font-serif-kr {
      font-family: 'Gowun Batang', serif;
    }
    
    /* Bookshelf Unit Styles */
    .bookshelf-unit {
      background: #e6c594;
      border-radius: 12px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.08), 0 10px 25px rgba(160, 120, 70, 0.15);
      border: 8px solid #c29b5c;
    }

    .shelf-row {
      border-bottom: 20px solid #ab8045;
      box-shadow: 0 8px 12px rgba(0,0,0,0.12);
      min-height: 200px;
      position: relative;
      background: linear-gradient(to bottom, rgba(240, 222, 192, 0.4), rgba(215, 185, 140, 0.6));
    }

    .shelf-row::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 0;
      right: 0;
      height: 6px;
      background: rgba(0,0,0,0.15);
    }

    /* 3D Book Spine styling */
    .book-spine {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
      transform-origin: bottom center;
      cursor: grab;
      box-shadow: -2px 0 5px rgba(0,0,0,0.15), inset 2px 0 3px rgba(255,255,255,0.3);
      position: relative;
      border-radius: 2px 4px 4px 2px;
      user-select: none;
      margin-right: -4px;
    }

    .book-spine:active {
      cursor: grabbing;
    }

    .book-spine:hover {
      transform: translateY(-14px) scale(1.03) translateZ(10px);
      box-shadow: -6px 10px 15px rgba(0,0,0,0.25);
      z-index: 20;
    }

    .book-spine.dragging {
      opacity: 0.4;
    }

    .book-spine::before {
      content: '';
      position: absolute;
      top: 0; left: 2px; bottom: 0;
      width: 2px;
      background: rgba(255,255,255,0.25);
    }

    .book-spine::after {
      content: '';
      position: absolute;
      top: 0; right: 2px; bottom: 0;
      width: 2px;
      background: rgba(0,0,0,0.15);
    }

    /* Modal Animation */
    .modal-enter {
      animation: modalSlide 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes modalSlide {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #f1e9db;
    }
    ::-webkit-scrollbar-thumb {
      background: #d4bc96;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 pb-20">

  <!-- Top Main Navigation Bar -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-amber-200/60 shadow-sm px-3 py-2.5 mb-6">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
      
      <!-- Logo / Title -->
      <div class="flex items-center gap-2 w-full md:w-auto justify-between md:justify-start">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-book-bookmark text-amber-600 text-lg"></i>
          <h1 class="font-bold text-slate-800 text-base tracking-tight font-serif-kr">나만의 독서 기록장</h1>
        </div>
        <!-- Mobile Add Book Button -->
        <button onclick="openAddModal()" 
                class="md:hidden px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-full text-xs font-medium shadow-sm flex items-center gap-1.5 active:scale-95 whitespace-nowrap">
          <i class="fa-solid fa-plus"></i>
          <span>책 등록</span>
        </button>
      </div>

      <!-- 3 Main Menu Navigation Tabs -->
      <nav class="flex items-center bg-amber-100/60 p-1 rounded-full border border-amber-200/60 w-full md:w-auto justify-center">
        <button onclick="switchTab('bookshelf')" id="nav-bookshelf" 
                class="flex-1 md:flex-initial px-3.5 py-1.5 rounded-full text-xs font-bold transition shadow-sm bg-amber-600 text-white whitespace-nowrap text-center">
          <i class="fa-solid fa-book-open mr-1"></i> 내 책꽂이
        </button>
        <button onclick="switchTab('status')" id="nav-status" 
                class="flex-1 md:flex-initial px-3.5 py-1.5 rounded-full text-xs font-medium transition text-amber-900 hover:bg-amber-200/50 whitespace-nowrap text-center">
          <i class="fa-solid fa-list-check mr-1"></i> 독서 상태
        </button>
        <button onclick="switchTab('stats')" id="nav-stats" 
                class="flex-1 md:flex-initial px-3.5 py-1.5 rounded-full text-xs font-medium transition text-amber-900 hover:bg-amber-200/50 whitespace-nowrap text-center">
          <i class="fa-solid fa-chart-pie mr-1"></i> 독서 통계
        </button>
      </nav>

      <!-- Desktop Add Book Button -->
      <div class="hidden md:block">
        <button onclick="openAddModal()" 
                class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-full text-sm font-medium shadow-md shadow-amber-200 flex items-center gap-2 transition active:scale-95 whitespace-nowrap">
          <i class="fa-solid fa-plus"></i>
          <span>새 책 등록</span>
        </button>
      </div>

    </div>
  </header>

  <!-- 컨텐츠 영역: 1. 내 책꽂이 뷰 -->
  <div id="view-bookshelf" class="max-w-7xl mx-auto px-4 space-y-6">
    <div class="bg-white/70 backdrop-blur p-4 rounded-2xl border border-amber-200/60 shadow-sm flex flex-col md:flex-row gap-3 items-center justify-between">
      <div class="flex flex-wrap items-center gap-1.5 w-full md:w-auto overflow-x-auto py-1" id="categoryPills">
        <!-- JS Rendered -->
      </div>
      <div class="relative w-full md:w-60">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-amber-500"></i>
        <input type="text" id="searchInput" placeholder="제목 또는 저자 검색..." 
               class="w-full pl-9 pr-3 py-1.5 bg-amber-50/60 border border-amber-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition">
      </div>
    </div>

    <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="bookshelvesContainer">
      <!-- JS Rendered -->
    </main>
  </div>

  <!-- 컨텐츠 영역: 2. 독서 상태 관리 뷰 -->
  <div id="view-status" class="max-w-6xl mx-auto px-4 hidden space-y-6">
    <!-- 독서 상태 선택 버튼 필터 -->
    <div class="bg-white/70 backdrop-blur p-2.5 rounded-2xl border border-amber-200/60 shadow-sm">
      <div class="flex items-center justify-center gap-2 overflow-x-auto py-0.5 no-scrollbar">
        <button onclick="setStatusFilter('읽은 책')" id="status-btn-읽은 책" 
                class="px-4 py-1.5 rounded-full text-xs font-bold bg-amber-600 text-white shadow-sm transition whitespace-nowrap shrink-0 flex items-center gap-1">
          <i class="fa-solid fa-circle-check text-emerald-400 text-[11px]"></i> <span>읽은 책</span>
        </button>
        <button onclick="setStatusFilter('읽고 있는 책')" id="status-btn-읽고 있는 책" 
                class="px-4 py-1.5 rounded-full text-xs font-medium bg-amber-100/70 text-amber-800 hover:bg-amber-200 transition whitespace-nowrap shrink-0 flex items-center gap-1">
          <i class="fa-solid fa-book-reader text-amber-500 text-[11px]"></i> <span>읽고 있는 책</span>
        </button>
        <button onclick="setStatusFilter('중단한 책')" id="status-btn-중단한 책" 
                class="px-4 py-1.5 rounded-full text-xs font-medium bg-amber-100/70 text-amber-800 hover:bg-amber-200 transition whitespace-nowrap shrink-0 flex items-center gap-1">
          <i class="fa-solid fa-circle-xmark text-rose-500 text-[11px]"></i> <span>중단한 책</span>
        </button>
      </div>
    </div>

    <!-- 독서 상태별 컨테이너 카드들 -->
    <div id="statusGridContainer" class="grid grid-cols-1 gap-6 max-w-2xl mx-auto">
      <!-- 1. 읽은 책 -->
      <div id="box-completed" class="bg-white rounded-2xl p-5 border border-emerald-200 shadow-sm space-y-4">
        <div class="flex items-center justify-between border-b border-emerald-100 pb-3">
          <h3 class="font-bold text-emerald-800 flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-emerald-500"></i> 읽은 책
          </h3>
          <span id="count-completed" class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">0권</span>
        </div>
        <div id="list-completed" class="space-y-3 min-h-[250px]"></div>
      </div>

      <!-- 2. 읽고 있는 책 -->
      <div id="box-reading" class="bg-white rounded-2xl p-5 border border-amber-200 shadow-sm space-y-4 hidden">
        <div class="flex items-center justify-between border-b border-amber-100 pb-3">
          <h3 class="font-bold text-amber-800 flex items-center gap-2">
            <i class="fa-solid fa-book-reader text-amber-500"></i> 읽고 있는 책
          </h3>
          <span id="count-reading" class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold">0권</span>
        </div>
        <div id="list-reading" class="space-y-3 min-h-[250px]"></div>
      </div>

      <!-- 3. 중단한 책 -->
      <div id="box-stopped" class="bg-white rounded-2xl p-5 border border-rose-200 shadow-sm space-y-4 hidden">
        <div class="flex items-center justify-between border-b border-rose-100 pb-3">
          <h3 class="font-bold text-rose-800 flex items-center gap-2">
            <i class="fa-solid fa-circle-xmark text-rose-500"></i> 중단한 책
          </h3>
          <span id="count-stopped" class="text-xs bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full font-bold">0권</span>
        </div>
        <div id="list-stopped" class="space-y-3 min-h-[250px]"></div>
      </div>
    </div>
  </div>

  <!-- 컨텐츠 영역: 3. 독서 통계 원그래프 뷰 -->
  <div id="view-stats" class="max-w-4xl mx-auto px-4 hidden space-y-6">
    <div class="bg-white rounded-2xl p-6 md:p-8 border border-amber-200 shadow-sm space-y-6">
      <div class="border-b border-amber-100 pb-4">
        <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
          <i class="fa-solid fa-chart-pie text-amber-600"></i> 세부 분야별 독서 현황 통계
        </h3>
      </div>
      
      <div class="flex flex-col md:flex-row items-center justify-center gap-8 py-4">
        <div class="relative w-56 h-56 flex items-center justify-center">
          <div id="donutChart" class="w-full h-full rounded-full shadow-inner" style="background: #e2e8f0;"></div>
          <div class="absolute inset-10 bg-white rounded-full flex flex-col items-center justify-center shadow-sm">
            <span class="text-xs text-slate-400 font-medium">총 도서</span>
            <span id="statTotalCount" class="text-xl font-bold text-slate-800 mt-0.5">0권</span>
          </div>
        </div>

        <div id="statsLegend" class="flex flex-col gap-2 max-h-60 overflow-y-auto w-full md:w-72 pr-2"></div>
      </div>
    </div>
  </div>

  <!-- Detail View Modal -->
  <div id="detailModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full shadow-2xl overflow-hidden modal-enter border border-amber-100 max-h-[90vh] flex flex-col">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-amber-50/50">
        <span id="detailCategoryBadge" class="px-3 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-semibold">분류</span>
        <div class="flex items-center gap-2">
          <button onclick="moveBookPosition(-1)" class="text-slate-500 hover:text-amber-700 p-1.5 transition bg-amber-50 rounded border border-amber-200 text-xs" title="왼쪽으로 이동">
            <i class="fa-solid fa-arrow-left"></i> 순서 변경
          </button>
          <button onclick="moveBookPosition(1)" class="text-slate-500 hover:text-amber-700 p-1.5 transition bg-amber-50 rounded border border-amber-200 text-xs" title="오른쪽으로 이동">
            순서 변경 <i class="fa-solid fa-arrow-right"></i>
          </button>
          <div class="h-4 w-[1px] bg-slate-300 mx-1"></div>
          <button id="editBtn" class="text-slate-400 hover:text-amber-600 p-1.5 transition" title="수정">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
          <button id="deleteBtn" class="text-slate-400 hover:text-rose-500 p-1.5 transition" title="삭제">
            <i class="fa-solid fa-trash-can"></i>
          </button>
          <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-700 p-1.5 transition">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>
      </div>

      <div class="p-6 overflow-y-auto flex-1 grid md:grid-cols-5 gap-6">
        <div class="md:col-span-2 flex flex-col items-center">
          <div id="detailCover" class="w-40 h-56 rounded-lg shadow-xl overflow-hidden border border-slate-200 flex items-center justify-center bg-slate-100 relative"></div>
          <div id="detailRating" class="mt-4 flex gap-1 text-amber-400 text-lg"></div>
        </div>
        <div class="md:col-span-3 space-y-4">
          <div>
            <h2 id="detailTitle" class="text-2xl font-bold text-slate-800 font-serif-kr leading-snug">책 제목</h2>
            <p id="detailAuthorPublisher" class="text-sm text-slate-500 mt-1">지은이 · 출판사</p>
          </div>
          <div class="flex items-center gap-4 text-xs text-slate-500 font-medium">
            <span><i class="fa-solid fa-book-open mr-1 text-amber-600"></i> 분량: <span id="detailPages">0</span>쪽</span>
            <span><i class="fa-solid fa-bookmark mr-1 text-amber-600"></i> 상태: <span id="detailStatusBadge" class="font-bold text-amber-700">읽은 책</span></span>
          </div>
          <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-100">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">줄거리 / 소감</h4>
            <p id="detailSummary" class="text-sm text-slate-600 whitespace-pre-line leading-relaxed">내용 없음</p>
          </div>
          <div class="bg-amber-50/80 p-4 rounded-xl border border-amber-200/60 relative">
            <i class="fa-solid fa-quote-left text-amber-200 text-2xl absolute top-2 left-3"></i>
            <h4 class="text-xs font-bold text-amber-700 uppercase tracking-wider mb-1 pl-5">인상 깊은 구절</h4>
            <p id="detailQuote" class="text-sm text-amber-900 font-serif-kr italic pl-5 leading-relaxed whitespace-pre-line">"구절 없음"</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Book Modal -->
  <div id="formModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden modal-enter max-h-[90vh] flex flex-col">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-amber-50/50">
        <h3 id="formTitle" class="font-bold text-slate-700">새 책 등록하기</h3>
        <button onclick="closeFormModal()" class="text-slate-400 hover:text-slate-700 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="bookForm" onsubmit="handleFormSubmit(event)" class="p-6 overflow-y-auto space-y-4 flex-1">
        <input type="hidden" id="bookId">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">책 제목 *</label>
          <input type="text" id="inputTitle" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">지은이 *</label>
            <input type="text" id="inputAuthor" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">출판사</label>
            <input type="text" id="inputPublisher" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">세부 분류 *</label>
            <select id="inputCategory" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white"></select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">독서 상태 *</label>
            <select id="inputStatus" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
              <option value="읽은 책">읽은 책</option>
              <option value="읽고 있는 책">읽고 있는 책</option>
              <option value="중단한 책">중단한 책</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">페이지 수</label>
            <input type="number" id="inputPages" placeholder="300" min="1" max="5000" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">내 별점</label>
          <div class="flex items-center gap-1 mt-1 text-amber-400 text-xl cursor-pointer" id="starInputContainer">
            <i class="fa-regular fa-star star-btn" data-value="1"></i>
            <i class="fa-regular fa-star star-btn" data-value="2"></i>
            <i class="fa-regular fa-star star-btn" data-value="3"></i>
            <i class="fa-regular fa-star star-btn" data-value="4"></i>
            <i class="fa-regular fa-star star-btn" data-value="5"></i>
          </div>
          <input type="hidden" id="inputRating" value="5">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">표지 이미지 파일 업로드</label>
          <input type="file" id="inputCoverFile" accept="image/*" onchange="handleFileSelect(event)"
                 class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200 cursor-pointer">
          <input type="hidden" id="inputCoverData">
          <div id="imagePreviewContainer" class="mt-2 hidden flex items-center gap-3 bg-slate-50 p-2 rounded-lg border border-slate-200">
            <img id="imagePreview" class="w-12 h-16 object-cover rounded border border-slate-300">
            <span class="text-xs text-slate-500 flex-1">업로드된 파일 이미지</span>
            <button type="button" onclick="removeImage()" class="text-xs text-rose-500 hover:underline">삭제</button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">줄거리 및 소감</label>
          <textarea id="inputSummary" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none resize-none"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">인상 깊은 구절</label>
          <textarea id="inputQuote" rows="4" placeholder="가장 기억에 남는 한 문장" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none font-serif-kr"></textarea>
        </div>
        <button type="submit" class="w-full py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl shadow-md transition">
          저장하기
        </button>
      </form>
    </div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    const ALL_CATEGORIES = [
      { id: '소설', name: '소설', spine: 'bg-purple-600 border-purple-500 text-white', headerBg: 'bg-purple-800', color: '#9333ea' },
      { id: '시', name: '시', spine: 'bg-fuchsia-600 border-fuchsia-500 text-white', headerBg: 'bg-fuchsia-800', color: '#c026d3' },
      { id: '에세이', name: '에세이', spine: 'bg-pink-600 border-pink-500 text-white', headerBg: 'bg-pink-800', color: '#db2777' },

    let books = [];
    let currentTab = 'bookshelf';
    let selectedCategories = [];
    let currentStatusFilter = '읽은 책';
    let searchQuery = '';
    let selectedBookId = null;

    function initData() {
      const saved = localStorage.getItem('pdf_imported_all_merged_books');
      if (saved) {
        books = JSON.parse(saved);
      } else {
        books = INITIAL_BOOKS;
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem('pdf_imported_all_merged_books', JSON.stringify(books));
    }

    function switchTab(tab) {
      currentTab = tab;
      ['bookshelf', 'status', 'stats'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`nav-${t}`).className = "flex-1 md:flex-initial px-3.5 py-1.5 rounded-full text-xs font-medium transition text-amber-900 hover:bg-amber-200/50 whitespace-nowrap text-center";
      });

      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`nav-${tab}`).className = "flex-1 md:flex-initial px-3.5 py-1.5 rounded-full text-xs font-bold transition shadow-sm bg-amber-600 text-white whitespace-nowrap text-center";

      if (tab === 'status') renderStatusView();
      if (tab === 'stats') renderStatsView();
    }

    function renderApp() {
      renderPills();
      renderBookshelves();
      populateCategorySelect();
      if (currentTab === 'status') renderStatusView();
      if (currentTab === 'stats') renderStatsView();
    }

    function renderPills() {
      const container = document.getElementById('categoryPills');
      const allSelected = selectedCategories.length === 0;

      let html = `
        <button onclick="toggleCategory('전체')" 
          class="px-3 py-1 rounded-full text-xs font-medium transition whitespace-nowrap ${allSelected ? 'bg-amber-600 text-white shadow-sm' : 'bg-amber-100/70 text-amber-800 hover:bg-amber-200'}">
          전체
        </button>
      `;

      html += ALL_CATEGORIES.map(c => {
        const isSelected = selectedCategories.includes(c.id);
        return `
          <button onclick="toggleCategory('${c.id}')" 
            class="px-3 py-1 rounded-full text-xs font-medium transition whitespace-nowrap ${isSelected ? 'bg-amber-600 text-white shadow-sm' : 'bg-amber-100/70 text-amber-800 hover:bg-amber-200'}">
            ${c.name}
          </button>
        `;
      }).join('');

      container.innerHTML = html;
    }

    function toggleCategory(catId) {
      if (catId === '전체') {
        selectedCategories = [];
      } else {
        const idx = selectedCategories.indexOf(catId);
        if (idx > -1) {
          selectedCategories.splice(idx, 1);
        } else {
          selectedCategories.push(catId);
        }
      }
      renderApp();
    }

    function setStatusFilter(status) {
      currentStatusFilter = status;
      renderStatusView();
    }

    function populateCategorySelect() {
      const select = document.getElementById('inputCategory');
      select.innerHTML = ALL_CATEGORIES.map(c => `
        <option value="${c.id}">${c.name}</option>
      `).join('');
    }

    function renderBookshelves() {
      const container = document.getElementById('bookshelvesContainer');
      const searchedBooks = books.filter(b => b.title.toLowerCase().includes(searchQuery.toLowerCase()) || b.author.toLowerCase().includes(searchQuery.toLowerCase()));

      let targetCategories = ALL_CATEGORIES;
      if (selectedCategories.length > 0) {
        targetCategories = ALL_CATEGORIES.filter(c => selectedCategories.includes(c.id));
      }

      container.innerHTML = targetCategories.map(cat => {
        const catBooks = searchedBooks.filter(b => b.category === cat.id);
        return `
          <div class="bookshelf-unit p-4 space-y-2.5 shadow-lg flex flex-col justify-between">
            <div class="${cat.headerBg} text-white px-3 py-1.5 rounded flex justify-between items-center font-bold text-xs tracking-wide shadow-sm">
              <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-bookmark opacity-80"></i>
                <span>${cat.name}</span>
              </div>
              <span class="text-[11px] bg-white/20 px-2 py-0.5 rounded-full">${catBooks.length}권</span>
            </div>
            <div class="shelf-row p-2.5 md:p-3.5 flex flex-wrap items-end gap-0.5 px-3"
                 ondragover="allowDrop(event)" ondrop="handleDrop(event, '${cat.id}')">
              ${catBooks.length === 0 ? `
                <div class="w-full flex items-center justify-center text-amber-900/40 text-xs font-medium h-28">
                  등록된 책이 없습니다.
                </div>
              ` : catBooks.map(book => renderBookSpine(book, cat)).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderBookSpine(book, cat) {
      const pages = book.pages || 200;
      const calculatedWidth = Math.min(Math.max(34, Math.round(34 + (pages / 35))), 65);
      return `
        <div draggable="true" 
             ondragstart="handleDragStart(event, '${book.id}')" 
             ondragend="handleDragEnd(event)"
             ondragover="handleDragOver(event)"
             onclick="openDetailModal('${book.id}')" 
             style="width: ${calculatedWidth}px;"
             class="book-spine ${cat.spine} h-32 md:h-38 px-1 py-2.5 flex flex-col justify-between items-center text-center">
          <div class="text-[11px] md:text-xs font-bold font-serif-kr [writing-mode:vertical-rl] tracking-wider truncate max-h-24">
            ${book.title}
          </div>
          <div class="h-1"></div>
        </div>
      `;
    }

    function renderStatusView() {
      const filterBtns = ['읽은 책', '읽고 있는 책', '중단한 책'];
      filterBtns.forEach(f => {
        const btn = document.getElementById(`status-btn-${f}`);
        if (btn) {
          if (currentStatusFilter === f) {
            btn.className = "px-4 py-1.5 rounded-full text-xs font-bold bg-amber-600 text-white shadow-sm transition whitespace-nowrap shrink-0 flex items-center gap-1";
          } else {
            btn.className = "px-4 py-1.5 rounded-full text-xs font-medium bg-amber-100/70 text-amber-800 hover:bg-amber-200 transition whitespace-nowrap shrink-0 flex items-center gap-1";
          }
        }
      });

      const boxCompleted = document.getElementById('box-completed');
      const boxReading = document.getElementById('box-reading');
      const boxStopped = document.getElementById('box-stopped');

      boxCompleted.classList.toggle('hidden', currentStatusFilter !== '읽은 책');
      boxReading.classList.toggle('hidden', currentStatusFilter !== '읽고 있는 책');
      boxStopped.classList.toggle('hidden', currentStatusFilter !== '중단한 책');

      const statuses = [
        { key: '읽은 책', id: 'completed', countId: 'count-completed', listId: 'list-completed' },
        { key: '읽고 있는 책', id: 'reading', countId: 'count-reading', listId: 'list-reading' },
        { key: '중단한 책', id: 'stopped', countId: 'count-stopped', listId: 'list-stopped' }
      ];

      statuses.forEach(s => {
        const matched = books.filter(b => (b.status || '읽은 책') === s.key);
        document.getElementById(s.countId).textContent = `${matched.length}권`;
        
        const container = document.getElementById(s.listId);
        if (matched.length === 0) {
          container.innerHTML = `<div class="text-xs text-slate-400 text-center py-10">등록된 책이 없습니다.</div>`;
        } else {
          container.innerHTML = matched.map(book => `
            <div onclick="openDetailModal('${book.id}')" class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 bg-amber-50/20 hover:bg-amber-50/80 cursor-pointer transition shadow-sm">
              <div class="w-11 h-15 bg-amber-100 rounded flex items-center justify-center text-xs font-bold font-serif-kr shrink-0 overflow-hidden shadow-xs">
                ${book.cover ? `<img src="${book.cover}" class="w-full h-full object-cover">` : book.title.slice(0,2)}
              </div>
              <div class="flex-1 min-w-0">
                <h4 class="text-sm font-bold text-slate-800 truncate">${book.title}</h4>
                <p class="text-xs text-slate-500 truncate mt-0.5">${book.author} · <span class="text-amber-700 font-medium">${book.category}</span></p>
              </div>
              <i class="fa-solid fa-chevron-right text-xs text-slate-300"></i>
            </div>
          `).join('');
        }
      });
    }

    function renderStatsView() {
      const totalBooks = books.length;
      document.getElementById('statTotalCount').textContent = `${totalBooks}권`;

      const statsData = ALL_CATEGORIES.map(cat => {
        const count = books.filter(b => b.category === cat.id).length;
        return { ...cat, count };
      }).filter(item => item.count > 0).sort((a, b) => b.count - a.count);

      const donutEl = document.getElementById('donutChart');
      const legendEl = document.getElementById('statsLegend');

      if (totalBooks === 0) {
        donutEl.style.background = '#e2e8f0';
        legendEl.innerHTML = `<div class="text-xs text-slate-400 text-center py-4">등록된 도서가 없습니다.</div>`;
        return;
      }

      let cumulativePercent = 0;
      let gradientStops = [];

      statsData.forEach(item => {
        const percent = (item.count / totalBooks) * 100;
        const start = cumulativePercent;
        const end = cumulativePercent + percent;
        gradientStops.push(`${item.color} ${start}% ${end}%`);
        item.percent = Math.round(percent);
        cumulativePercent = end;
      });

      donutEl.style.background = `conic-gradient(${gradientStops.join(', ')})`;

      legendEl.innerHTML = statsData.map(item => `
        <div class="flex items-center justify-between text-xs font-medium">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full shrink-0" style="background-color: ${item.color};"></span>
            <span class="text-slate-700">${item.name}</span>
          </div>
          <span class="font-bold text-slate-900">${item.count}권 (${item.percent}%)</span>
        </div>
      `).join('');
    }

    let draggedBookId = null;
    function handleDragStart(e, id) { draggedBookId = id; e.target.classList.add('dragging'); }
    function handleDragEnd(e) { e.target.classList.remove('dragging'); draggedBookId = null; }
    function allowDrop(e) { e.preventDefault(); }
    function handleDragOver(e) {
      e.preventDefault();
      const targetSpine = e.target.closest('.book-spine');
      if (!targetSpine || !draggedBookId) return;
      const row = targetSpine.closest('.shelf-row');
      const draggedEl = row.querySelector(`[ondragstart*="${draggedBookId}"]`);
      if (!draggedEl) return;
      const midpoint = targetSpine.getBoundingClientRect().left + targetSpine.getBoundingClientRect().width / 2;
      if (e.clientX < midpoint) row.insertBefore(draggedEl, targetSpine);
      else row.insertBefore(draggedEl, targetSpine.nextSibling);
    }
    function handleDrop(e, categoryId) {
      e.preventDefault();
      if (!draggedBookId) return;
      const row = e.target.closest('.shelf-row');
      if (!row) return;
      const rowBookIds = Array.from(row.querySelectorAll('.book-spine')).map(el => {
        const match = el.getAttribute('onclick').match(/'([^']+)'/);
        return match ? match[1] : null;
      }).filter(Boolean);

      const draggedBook = books.find(b => b.id === draggedBookId);
      if (draggedBook) draggedBook.category = categoryId;

      const otherBooks = books.filter(b => b.id !== draggedBookId && !rowBookIds.includes(b.id));
      const reorderedRowBooks = rowBookIds.map(id => books.find(b => b.id === id)).filter(Boolean);
      books = [...otherBooks, ...reorderedRowBooks];
      saveData();
      renderApp();
    }

    function moveBookPosition(direction) {
      if (!selectedBookId) return;
      const bookIdx = books.findIndex(b => b.id === selectedBookId);
      if (bookIdx === -1) return;
      const currentBook = books[bookIdx];
      const sameCategoryBooks = books.filter(b => b.category === currentBook.category);
      const subIdx = sameCategoryBooks.findIndex(b => b.id === selectedBookId);
      const targetSubIdx = subIdx + direction;
      if (targetSubIdx < 0 || targetSubIdx >= sameCategoryBooks.length) return;
      const targetBook = sameCategoryBooks[targetSubIdx];
      const targetIdx = books.findIndex(b => b.id === targetBook.id);
      books[bookIdx] = targetBook;
      books[targetIdx] = currentBook;
      saveData();
      renderApp();
    }

    function openDetailModal(id) {
      selectedBookId = id;
      const book = books.find(b => b.id === id);
      if (!book) return;

      document.getElementById('detailTitle').textContent = book.title;
      document.getElementById('detailAuthorPublisher').textContent = `${book.author} · ${book.publisher || '출판사 미상'}`;
      document.getElementById('detailCategoryBadge').textContent = book.category;
      document.getElementById('detailPages').textContent = book.pages || '200';
      document.getElementById('detailStatusBadge').textContent = book.status || '읽은 책';
      document.getElementById('detailSummary').textContent = book.summary || '작성된 소감이 없습니다.';
      document.getElementById('detailQuote').textContent = book.quote ? book.quote : '인상 깊은 구절이 등록되지 않았습니다.';

      const coverContainer = document.getElementById('detailCover');
      const matchedCategory = ALL_CATEGORIES.find(c => c.id === book.category) || ALL_CATEGORIES[0];
      if (book.cover) {
        coverContainer.innerHTML = `<img src="${book.cover}" alt="표지" class="w-full h-full object-cover">`;
      } else {
        coverContainer.innerHTML = `
          <div class="w-full h-full ${matchedCategory.spine} flex flex-col items-center justify-center p-3 text-center">
            <span class="text-xs font-bold font-serif-kr leading-snug">${book.title}</span>
            <span class="text-[10px] mt-2 opacity-80">${book.author}</span>
          </div>
        `;
      }

      document.getElementById('detailRating').innerHTML = Array.from({length: 5}, (_, i) => 
        `<i class="fa-${i < (book.rating || 5) ? 'solid' : 'regular'} fa-star"></i>`
      ).join('');

      document.getElementById('editBtn').onclick = () => openEditModal(book.id);
      document.getElementById('deleteBtn').onclick = () => deleteBook(book.id);
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('inputCoverData').value = e.target.result;
        document.getElementById('imagePreview').src = e.target.result;
        document.getElementById('imagePreviewContainer').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      document.getElementById('inputCoverFile').value = '';
      document.getElementById('inputCoverData').value = '';
      document.getElementById('imagePreviewContainer').classList.add('hidden');
    }

    function setupStarRating() {
      document.querySelectorAll('.star-btn').forEach(star => {
        star.addEventListener('click', (e) => {
          const val = parseInt(e.target.getAttribute('data-value'));
          document.getElementById('inputRating').value = val;
          updateStarUI(val);
        });
      });
    }

    function updateStarUI(val) {
      document.querySelectorAll('.star-btn').forEach((star, index) => {
        if (index < val) { star.classList.remove('fa-regular'); star.classList.add('fa-solid'); }
        else { star.classList.remove('fa-solid'); star.classList.add('fa-regular'); }
      });
    }

    function openAddModal() {
      document.getElementById('formTitle').textContent = '새 책 등록하기';
      document.getElementById('bookId').value = '';
      document.getElementById('bookForm').reset();
      document.getElementById('inputRating').value = '5';
      removeImage();
      updateStarUI(5);
      document.getElementById('formModal').classList.remove('hidden');
    }

    function openEditModal(id) {
      closeDetailModal();
      const book = books.find(b => b.id === id);
      if (!book) return;
      document.getElementById('formTitle').textContent = '독서 기록 수정';
      document.getElementById('bookId').value = book.id;
      document.getElementById('inputTitle').value = book.title;
      document.getElementById('inputAuthor').value = book.author;
      document.getElementById('inputPublisher').value = book.publisher || '';
      document.getElementById('inputCategory').value = book.category;
      document.getElementById('inputStatus').value = book.status || '읽은 책';
      document.getElementById('inputPages').value = book.pages || '';
      document.getElementById('inputRating').value = book.rating || 5;
      document.getElementById('inputSummary').value = book.summary || '';
      document.getElementById('inputQuote').value = book.quote || '';

      if (book.cover) {
        document.getElementById('inputCoverData').value = book.cover;
        document.getElementById('imagePreview').src = book.cover;
        document.getElementById('imagePreviewContainer').classList.remove('hidden');
      } else { removeImage(); }

      updateStarUI(book.rating || 5);
      document.getElementById('formModal').classList.remove('hidden');
    }

    function closeFormModal() { document.getElementById('formModal').classList.add('hidden'); }

    function handleFormSubmit(event) {
      event.preventDefault();
      const id = document.getElementById('bookId').value;
      const title = document.getElementById('inputTitle').value;
      const author = document.getElementById('inputAuthor').value;
      const publisher = document.getElementById('inputPublisher').value;
      const category = document.getElementById('inputCategory').value;
      const status = document.getElementById('inputStatus').value;
      const pages = parseInt(document.getElementById('inputPages').value) || 200;
      const rating = parseInt(document.getElementById('inputRating').value);
      const summary = document.getElementById('inputSummary').value;
      const quote = document.getElementById('inputQuote').value;
      const cover = document.getElementById('inputCoverData').value;

      if (id) {
        const idx = books.findIndex(b => b.id === id);
        if (idx !== -1) books[idx] = { id, title, author, publisher, category, status, pages, rating, summary, quote, cover };
      } else {
        books.push({ id: Date.now().toString(), title, author, publisher, category, status, pages, rating, summary, quote, cover });
      }

      saveData();
      renderApp();
      closeFormModal();
    }

    function deleteBook(id) {
      if (confirm('이 독서 기록을 삭제하시겠습니까?')) {
        books = books.filter(b => b.id !== id);
        saveData();
        renderApp();
        closeDetailModal();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initData();
      setupStarRating();
      renderApp();
      document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderBookshelves();
      });
    });
  </script>
</body>
</html>
